# ======================================================================
# apps/gateway-control：独立控制面可执行程序
# ----------------------------------------------------------------------
# 职责：
#   1. CLI 参数解析（绑定地址 / 数据库 / Admin Token）
#   2. 连接 PostgreSQL（或 --memory 单机模式）
#   3. 启动 Admin API（/api/admin/v1）
#
# 该二进制不包含数据面代理，可独立部署。
# ======================================================================

[package]
name = "gateway-control"
version = "0.1.0"
edition = "2021"
description = "API Gateway 控制面可执行程序"
license = "MIT"

[[bin]]
name = "gateway-control"
path = "src/main.rs"

[dependencies]
# workspace crates
gateway-control-api = { path = "../../crates/gateway-control-api" }
gateway-control-grpc = { path = "../../crates/gateway-control-grpc" }
gateway-control-service = { path = "../../crates/gateway-control-service" }
gateway-storage = { path = "../../crates/gateway-storage" }
gateway-observability = { path = "../../crates/gateway-observability" }

# 框架
axum = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
