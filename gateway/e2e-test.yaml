# 端到端冒烟测试配置
# 目标：验证"认证失败请求绝对访问不到上游"这个核心安全保证

gateway:
  id: gateway-e2e-test
  instance_name: test-instance

server:
  http:
    address: "127.0.0.1"
    port: 18080
  admin:
    address: "127.0.0.1"
    port: 18090

runtime:
  max_concurrent_requests: 100
  max_request_body_size: 10485760  # 10MB

observability:
  level: info

# ======= Upstream：本地 mock HTTP 服务 =======
upstreams:
  - id: mock-backend
    name: "Mock Backend"
    enabled: true
    algorithm: round_robin
    endpoints:
      - host: "127.0.0.1"
        port: 19999
        weight: 1

# ======= Service =======
services:
  - id: svc-mock
    name: "Mock Service"
    enabled: true
    upstream_id: mock-backend

# ======= Routes =======
routes:
  # Route A：需要 Bearer token 认证的 API
  - id: route-auth-required
    name: "Protected API (auth required)"
    enabled: true
    priority: 100
    path_type: prefix
    path_value: "/api/protected"
    service_id: svc-mock
    auth_policy_id: auth-bearer-demo

  # Route B：公开 API（无需认证）
  - id: route-public
    name: "Public API (no auth)"
    enabled: true
    priority: 10
    path_type: prefix
    path_value: "/api/public"
    service_id: svc-mock

# ======= Policies =======
policies:
  auth:
    - id: auth-bearer-demo
      name: "Bearer Token Auth"
      enabled: true
      type: jwt
      secret: "test-secret-key-for-e2e-super-long-and-secure-12345"
      algorithms: ["HS256"]
      issuer: "gateway-e2e"
      required: true
      header_name: "Authorization"
