# ======================================================================
# gateway-proxy：Hyper 流式反向代理
# ----------------------------------------------------------------------
# 设计原则：
#   1. 使用 hyper::client 与 hyper::server，不使用 axum 的代理能力。
#   2. 请求体和响应体都是流式 Body，避免全量读取。
#   3. 正确处理 Hop-by-Hop Header。
#   4. 连接失败/超时/上游 5xx 统一映射到 GatewayError。
# ======================================================================

[package]
name = "gateway-proxy"
version = "0.1.0"
edition = "2021"
description = "API Gateway Hyper 流式反向代理核心"
license = "MIT"

[dependencies]
gateway-common = { path = "../gateway-common" }
gateway-core = { path = "../gateway-core" }

hyper = { workspace = true }
hyper-util = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }

tokio = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
tokio = { workspace = true }
