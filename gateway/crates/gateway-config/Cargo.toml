# ======================================================================
# gateway-config：配置文件加载与校验
# ----------------------------------------------------------------------
# 设计原则：
#   1. 只负责读取/校验，不参与运行时配置分发。
#   2. 明确拒绝未知字段（不使用 #[serde(deny_unknown_fields)] 的话
#      可以在顶层手动处理未知字段）。
#   3. 校验错误必须带有明确的字段路径，例如 "routes[2].methods"。
# ======================================================================

[package]
name = "gateway-config"
version = "0.1.0"
edition = "2021"
description = "API Gateway 配置加载与校验"
license = "MIT"

[dependencies]
gateway-common = { path = "../gateway-common" }
gateway-core = { path = "../gateway-core" }

serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
figment = { workspace = true }
