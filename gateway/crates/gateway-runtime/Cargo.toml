# ======================================================================
# gateway-runtime：数据面运行时组合根
# ----------------------------------------------------------------------
# 职责：
#   1. 启动时加载 YAML 配置、编译 RouteTable、构建 UpstreamRegistry。
#   2. 组装 Hyper Server + Tower Service + Proxy Client Pipeline。
#   3. 启动 Axum Admin Server（Health/Version 检查）。
#   4. 优雅关闭协调。
#
# Phase 1 中 Runtime 是数据面的唯一入口。
# 后续 Phase 3 引入 Control Plane 后，Runtime 会新增配置热更新能力。
# ======================================================================

[package]
name = "gateway-runtime"
version = "0.1.0"
edition = "2021"
description = "API Gateway 数据面运行时组合根"
license = "MIT"

[dependencies]
# 本项目 crates
gateway-common = { path = "../gateway-common" }
gateway-core = { path = "../gateway-core" }
gateway-config = { path = "../gateway-config" }
gateway-routing = { path = "../gateway-routing" }
gateway-discovery = { path = "../gateway-discovery" }
gateway-upstream = { path = "../gateway-upstream" }
gateway-proxy = { path = "../gateway-proxy" }
gateway-network = { path = "../gateway-network" }
gateway-observability = { path = "../gateway-observability" }

# Phase 2 插件能力（runtime 的生产依赖暂不包含插件组装；
# 真实组装留给 Phase 3 Pipeline 改造。这里只加 dev-dependencies 做集成测试）

# 框架
axum = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
tower = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
bytes = { workspace = true }
signal-hook = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Phase 2 插件 crate：集成测试用（不进入 runtime 的生产依赖）
gateway-plugin = { path = "../gateway-plugin" }
gateway-security = { path = "../gateway-security" }
gateway-traffic = { path = "../gateway-traffic" }
gateway-transform = { path = "../gateway-transform" }
gateway-resilience = { path = "../gateway-resilience" }

# 测试辅助
base64 = { workspace = true }
wiremock = { workspace = true }
assert-json-diff = { workspace = true }
tempfile = { workspace = true }
