# ======================================================================
# gateway-common：全 workspace 共享的错误类型和通用常量
# ----------------------------------------------------------------------
# 设计原则：
#   1. 这个 crate 不依赖任何项目内其他 crate，必须是最底层。
#   2. 所有 crate 的错误最终应可映射到 GatewayError。
#   3. 不在这里放入领域模型（放入 gateway-core）。
# ======================================================================

[package]
name = "gateway-common"
version = "0.1.0"
edition = "2021"
description = "API Gateway 共享错误类型与通用常量"
license = "MIT"

[dependencies]
thiserror = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
http = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
