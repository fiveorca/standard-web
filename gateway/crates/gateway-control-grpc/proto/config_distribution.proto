// ======================================================================
// 控制面 ↔ 数据面配置分发协议（Phase 4）
// ----------------------------------------------------------------------
// 设计要点：
//   - 数据面主动注册 + 周期性心跳（心跳同时上报已应用版本）
//   - 控制面通过 has_update 标记告知是否需要拉取新快照
//   - 快照以 JSON 传输（CompiledSnapshot 序列化后的 payload）
//   - 数据面应用成功后 ReportApply，控制面据此记录实例状态
// ======================================================================

syntax = "proto3";

package gateway.config.v1;

// 配置分发服务。
service ConfigDistribution {
  // 数据面启动时注册自身。
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // 周期性心跳：上报已应用版本，获取是否有新配置。
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // 拉取当前最新快照。
  rpc FetchSnapshot(FetchSnapshotRequest) returns (SnapshotResponse);

  // 上报快照应用结果（ACK / NACK）。
  rpc ReportApply(ApplyReport) returns (ApplyAck);
}

message RegisterRequest {
  // 数据面实例唯一标识（gateway.id + instance_name）
  string instance_id = 1;
  // 网关集群标识
  string gateway_id = 2;
  // 数据面自报地址（仅用于运维展示，不参与转发）
  string endpoint = 3;
}

message RegisterResponse {
  // 控制面当前最新配置版本（0 表示尚未发布任何配置）
  uint64 current_version = 1;
  // 最新配置 checksum
  string checksum = 2;
}

message HeartbeatRequest {
  string instance_id = 1;
  // 数据面当前已成功应用的版本（0 表示尚未应用）
  uint64 applied_version = 2;
}

message HeartbeatResponse {
  // 控制面当前最新版本
  uint64 current_version = 1;
  // 是否存在比 applied_version 更新的版本
  bool has_update = 2;
  string checksum = 3;
}

message FetchSnapshotRequest {
  string instance_id = 1;
}

message SnapshotResponse {
  // 快照版本（0 表示控制面尚无已发布配置）
  uint64 version = 1;
  string checksum = 2;
  // CompiledSnapshot 的 JSON 序列化结果
  string payload_json = 3;
}

message ApplyReport {
  string instance_id = 1;
  uint64 version = 2;
  // true = 应用成功（ACK），false = 应用失败（NACK，数据面继续使用旧配置）
  bool success = 3;
  string message = 4;
}

message ApplyAck {
  bool accepted = 1;
}
