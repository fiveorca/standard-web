# ======================================================================
# gateway-storage：控制面持久化抽象与实现
# ----------------------------------------------------------------------
# 职责：
#   1. 定义控制面资源仓储接口（GatewayRepository）
#   2. 提供内存实现（测试 / 单机无数据库场景）
#   3. 提供 PostgreSQL 实现（SQLx 运行时查询，不依赖 DATABASE_URL 编译）
#   4. 管理配置版本、发布记录与审计日志的持久化
#
# 约束：
#   - 不依赖 gateway-config / gateway-runtime / control-service，
#     避免形成 "存储 → 运行时" 的反向依赖。
# ======================================================================

[package]
name = "gateway-storage"
version = "0.1.0"
edition = "2021"
description = "API Gateway 控制面持久化层"
license = "MIT"

[dependencies]
# 本项目 crates
gateway-common = { path = "../gateway-common" }
gateway-core = { path = "../gateway-core" }

# 异步 / 序列化
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

# 时间与数据库
chrono = { workspace = true }
sqlx = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
