# ======================================================================
# gateway-plugin：插件系统
# ----------------------------------------------------------------------
# 职责：
#   1. 定义插件执行阶段（PluginPhase，对应设计文档 4.12 的 9 个阶段）
#   2. 定义插件接口（Plugin trait：名称/版本/阶段/优先级/配置校验/
#      初始化/执行/超时/生命周期）
#   3. 定义插件执行结果与短路语义（PluginDecision）
#   4. 提供确定性排序的插件链（PluginChain）与编译期注册表（PluginRegistry）
#
# 依赖方向（不允许反向依赖）：
#   gateway-common ← gateway-core ← gateway-plugin
#   gateway-plugin 不依赖 gateway-runtime / gateway-proxy / gateway-network，
#   保证插件层无法绕过 Core 的安全边界、也无法直接触碰 IO。
# ======================================================================

[package]
name = "gateway-plugin"
version = "0.1.0"
edition = "2021"
description = "API Gateway 插件系统：阶段、接口、链式执行与短路"
license = "MIT"

[dependencies]
# 项目内依赖：错误类型 + 领域模型（RequestContext / RouteConfig）
gateway-common = { path = "../gateway-common" }
gateway-core = { path = "../gateway-core" }

# HTTP 基础类型：Parts / HeaderMap / StatusCode / HeaderValue
http = { workspace = true }
# 响应体字节缓冲（插件短路的 body 是内存中的 Bytes）
bytes = { workspace = true }
# 插件配置校验用的通用 JSON 值
serde = { workspace = true }
serde_json = { workspace = true }
# async trait 的类型擦除（Plugin trait 含 async fn）
async-trait = { workspace = true }
# 插件执行超时（tokio::time::timeout）
tokio = { workspace = true }
# 插件执行链路追踪
tracing = { workspace = true }
# 插件错误枚举
thiserror = { workspace = true }

[dev-dependencies]
# 测试需要 #[tokio::test] 与超时场景
tokio = { workspace = true, features = ["macros", "rt", "time"] }
