# ======================================================================
# gateway-core：领域模型 + 运行时 Trait
# ----------------------------------------------------------------------
# 设计原则：
#   1. 不依赖任何 IO 框架（不依赖 tokio/hyper/axum/tower）。
#   2. 不依赖任何数据库（不依赖 sqlx）。
#   3. 不依赖 gateway-config（配置加载逻辑在 config crate）。
#   4. 这里定义的 Trait 是模块解耦的关键：ServiceDiscoveryProvider、
#      LoadBalancer、RouteResolver 等。
# ======================================================================

[package]
name = "gateway-core"
version = "0.1.0"
edition = "2021"
description = "API Gateway 领域模型与运行时抽象"
license = "MIT"

[dependencies]
gateway-common = { path = "../gateway-common" }

serde = { workspace = true }
async-trait = { workspace = true }
http = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# 测试用 JSON 反序列化（与 YAML 走同一 serde 路径，验证策略模型的字段契约）
serde_json = { workspace = true }
