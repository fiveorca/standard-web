# ======================================================================
# gateway-discovery：服务发现实现
# ----------------------------------------------------------------------
# Phase 1 只实现 StaticProvider（从 YAML 配置读取的静态端点列表）。
# 后续阶段会加入 DNS / Kubernetes / Consul 等 Provider，
# 统一通过 ServiceDiscoveryProvider Trait 抽象。
# ======================================================================

[package]
name = "gateway-discovery"
version = "0.1.0"
edition = "2021"
description = "API Gateway 服务发现 Provider 实现"
license = "MIT"

[dependencies]
gateway-common = { path = "../gateway-common" }
gateway-core = { path = "../gateway-core" }

async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# Kubernetes EndpointSlice Provider：访问 K8s API（HTTPS + Bearer Token）
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
http = { workspace = true }

# TLS：rustls（不使用 openssl，避免运行环境依赖）
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
webpki-roots = "0.26"

[dev-dependencies]
tokio = { workspace = true }
