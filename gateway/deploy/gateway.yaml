# ======================================================================
# Gateway 数据面示例配置（生产模板）
# ----------------------------------------------------------------------
# 与 e2e-test.yaml 的区别：
#   - 监听 0.0.0.0（容器内需要对外暴露）
#   - 开启 Prometheus Metrics
#   - 日志使用 JSON 格式，便于采集
# ======================================================================

gateway:
  id: gateway-prod
  instance_name: gateway-node-1
  environment: production

server:
  http:
    enabled: true
    address: "0.0.0.0"
    port: 8080
    # ------------------------------------------------------------------
    # HTTPS/TLS（默认关闭；启用后该端口只接受 HTTPS）
    # ------------------------------------------------------------------
    # tls:
    #   enabled: true
    #   # 方式 A：引用证书资源（YAML 中的 certificates 或控制面发布）
    #   certificate_id: "api-example-com"
    #   # 方式 B：直接加载 PEM 文件（修改文件后自动热重载）
    #   cert_file: "certs/server.crt"
    #   key_file: "certs/server.key"
    #   domains: ["api.example.com", "*.example.com"]
    #   # 可选 mTLS：要求客户端证书由该 CA 签发
    #   # client_ca_file: "certs/client-ca.crt"
    #   reload_interval_secs: 10
    #
    # 控制面模式（control_plane.enabled: true）下允许零本地证书启动：
    # 端口先监听但握手失败，控制面发布证书后自动激活，无需重启。
  admin:
    enabled: true
    address: "0.0.0.0"
    port: 8081

runtime:
  max_connections: 10000
  max_concurrent_requests: 5000
  max_request_body_size: 10485760
  graceful_shutdown_timeout_secs: 30

observability:
  logging:
    level: info
    format: json
  metrics:
    enabled: true
    path: /metrics

# 控制面配置分发（Phase 4）。
# 独立/分布式部署时取消注释即可让数据面从控制面拉取配置：
# control_plane:
#   enabled: true
#   endpoint: "http://gateway-control:8092"
#   heartbeat_interval_secs: 10
#   reconnect_interval_secs: 5

upstreams:
  - id: demo-upstream
    name: "Demo Upstream"
    enabled: true
    algorithm: round_robin
    # ------------------------------------------------------------------
    # 健康检查（可选）
    #   - 主动：周期探测端点，连续失败/成功达到阈值后摘流 / 恢复
    #   - 被动：真实请求的连接失败、超时、5xx 也计入失败统计
    # 未配置时端点保持乐观可用（UNKNOWN 也可被选中）
    # ------------------------------------------------------------------
    # health_check:
    #   enabled: true
    #   kind: http              # http | tcp
    #   path: /healthz          # kind=http 时的探测路径
    #   interval_secs: 10
    #   timeout_secs: 3
    #   unhealthy_threshold: 3  # 连续失败次数 → UNHEALTHY
    #   healthy_threshold: 2    # 连续成功次数 → HEALTHY
    #   expected_status: "200-299"  # 可选，单值 "200" 或闭区间 "200-299"，缺省接受 200-399
    #   passive: { enabled: true, failure_threshold: 5, recovery_threshold: 3 }
    endpoints:
      - host: "mock-backend"
        port: 80
        weight: 1

services:
  - id: demo-service
    name: "Demo Service"
    enabled: true
    upstream_id: demo-upstream

routes:
  - id: demo-route
    name: "Public Demo API"
    enabled: true
    priority: 10
    path_type: prefix
    path_value: "/api/public"
    service_id: demo-service
    # 治理策略按 ID 引用（对应下方 policies 段）：
    # auth_policy_id: partner-keys
    # quota_policy_id: partner-daily
    # waf_policy_id: edge-waf

# ======================================================================
# 治理策略（Phase 7）
# ----------------------------------------------------------------------
# 策略与 Route 通过 *_policy_id 建立引用；发布新快照即生效。
# 下面的示例默认全部注释：按需取消注释并替换占位值。
# ======================================================================
# policies:
#   # ------------------------------------------------------------------
#   # 鉴权：API Key 生命周期
#   #   - 生产环境只保存 64 位 SHA-256 摘要（key_hash），不保存明文
#   #   - 明文 key 仅用于本地开发，或在生成时一次性写入
#   #   - 支持吊销（revoked）、过期（expires_at）、作用域（scopes）
#   #     与 Consumer 绑定（consumer_id → 认证身份 subject）
#   # ------------------------------------------------------------------
#   auth:
#     - id: partner-keys
#       type: api_key
#       header_name: X-API-Key
#       required_scopes: [orders:read]
#       keys:
#         - id: partner-a
#           key_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
#           consumer_id: partner-a
#           tenant_id: tenant-1
#           scopes: [orders:read, orders:write]
#           expires_at: 1798761600        # Unix 秒；缺省表示永不过期
#         - id: partner-b
#           key: "dev-only-plaintext-key" # 仅开发使用，生产必须改成 key_hash
#           consumer_id: partner-b
#           revoked: false
#
#     # ------------------------------------------------------------------
#     # 鉴权：JWT
#     #   - HS*：静态共享密钥（secret ≥ 32 字节）
#     #   - RS*/ES*：JWKS 公钥集合，按 Token Header 的 kid 选择
#     #   - JWKS 以内联 JSON 文档提供：远程 jwks_uri 由控制面/运维侧拉取后
#     #     写入快照，数据面不在请求路径上发起出网请求
#     # ------------------------------------------------------------------
#     - id: jwt-rs
#       type: jwt
#       algorithms: [RS256]
#       issuer: "https://issuer.example.com"
#       audience: "api.example.com"
#       jwks: |
#         {
#           "keys": [
#             {"kty":"RSA","use":"sig","alg":"RS256","kid":"2026-11",
#              "n":"<base64url modulus>","e":"AQAB"},
#             {"kty":"RSA","use":"sig","alg":"RS256","kid":"2026-12",
#              "n":"<base64url modulus>","e":"AQAB"}
#           ]
#         }
#
#   # ------------------------------------------------------------------
#   # 配额：自然日 / 自然月固定窗口
#   #   - scope: tenant | consumer | route
#   #   - backend: local（单实例）/ redis（多实例共享）
#   #   - 超限返回 429 GATEWAY_QUOTA_EXCEEDED
#   #   - 响应头：X-Quota-Limit / X-Quota-Remaining / X-Quota-Reset
#   # ------------------------------------------------------------------
#   quota:
#     - id: partner-daily
#       period: daily
#       limit: 100000
#       scope: consumer
#       backend: local
#       warn_at_percent: 80
#     - id: tenant-monthly
#       period: monthly
#       limit: 5000000
#       scope: tenant
#       backend: redis
#       redis_url: "redis://redis:6379/0"
#
#   # ------------------------------------------------------------------
#   # WAF：SQL 注入 / XSS / 命令注入 / 路径穿越 / 扫描器探测
#   #   - action: block（403）| detect（仅记录）
#   #   - sensitivity: low | medium | high
#   #   - targets: [path, query, headers, body]
#   # ------------------------------------------------------------------
#   waf:
#     - id: edge-waf
#       action: block
#       sensitivity: medium
#       targets: [path, query, headers]
#       max_body_bytes: 1048576
