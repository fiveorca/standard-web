# rustfmt 统一格式配置
edition = "2021"
max_width = 100
tab_spaces = 4
newline_style = "Unix"

# import 排序：stdlib → external → local imports
group_imports = "StdExternalCrate"
reorder_imports = true

# match 分支独占行
match_block_trailing_comma = true
trailing_semicolons = false

# 保持结构体字面量和模式的美观
struct_lit_single_line = false
struct_patterns = "always"

# 让长方法调用链每行一个调用
fn_call_width = 80
chain_width = 80

# 允许注释中有中文注释块（项目需求）
wrap_comments = false
normalize_comments = true
