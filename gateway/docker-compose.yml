# ======================================================================
# Gateway 生产部署编排（Phase 5 交付物）
# ----------------------------------------------------------------------
# 组成：
#   - postgres        ：控制面配置存储（配置版本 / 审计日志）
#   - gateway-control ：控制面（Admin API，监听 8091）
#   - gateway         ：数据面（业务端口 8080，管理端口 8081）
#   - mock-backend    ：演示上游（traefik/whoami）
#
# 启动：
#   docker compose up --build -d
# 验证：
#   curl http://127.0.0.1:8081/health
#   curl http://127.0.0.1:8081/metrics
#   curl http://127.0.0.1:8080/api/public
# ======================================================================

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway-control:
    build:
      context: .
      dockerfile: Dockerfile
    # 镜像 ENTRYPOINT 是 gateway，这里改指控制面二进制
    entrypoint: ["gateway-control"]
    command:
      - "--bind"
      - "0.0.0.0:8091"
      - "--database-url"
      - "postgres://gateway:gateway@postgres:5432/gateway"
      # 生产环境请通过 secret 注入，不要写在编排文件里
      - "--admin-tokens"
      - "demo-admin:ops"
    ports:
      - "8091:8091"
      # gRPC 配置分发端口（数据面注册 / 心跳 / 拉取快照）
      - "8092:8092"
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./deploy/gateway.yaml:/etc/gateway/gateway.yaml:ro
    depends_on:
      - mock-backend

  mock-backend:
    image: traefik/whoami:v1.10
    # 演示上游；真实环境替换为业务服务
    expose:
      - "80"

volumes:
  pgdata:
