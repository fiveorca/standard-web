global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: rust-api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]
        labels:
          instance: gateway

  - job_name: rust-api-gateway-admin
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:9090"]
        labels:
          instance: gateway-admin
