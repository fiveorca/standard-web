# 认证授权中心默认配置。
# 生产环境请通过 AUTH__SECTION__KEY 环境变量覆盖敏感项（如 master_key、internal_token）。

[server]
bind = "0.0.0.0:8080"
public_base_url = "http://localhost:8080"
request_timeout_secs = 30
max_body_bytes = 2097152
enable_cors = true
cors_allowed_origins = ["http://localhost:3000", "http://localhost:8081"]
trust_proxy_headers = true

[database]
url = "postgres://auth_center:auth_center@localhost:5432/auth_center"
max_connections = 16
min_connections = 1
auto_migrate = true
acquire_timeout_secs = 10

[redis]
url = "redis://localhost:6379/0"
key_prefix = "auth"
required = true

[security]
# 仅用于本地开发的 32 字节 Base64 主密钥；生产必须通过 AUTH__SECURITY__MASTER_KEY 覆盖。
master_key = "3geuNbeEwCC5OwBz78oo3fbuecUVKlNa4NmP1beftWQ="
issuer = "http://localhost:8080"
access_token_audience = "http://localhost:8080/api"
access_token_ttl_secs = 900
refresh_token_ttl_secs = 1209600
id_token_ttl_secs = 900
authorization_code_ttl_secs = 300
signing_algorithm = "RS256"
key_rotation_days = 90
key_retain_days = 30
session_ttl_secs = 43200
cookie_secure = false
cookie_same_site = "Lax"
cookie_name = "auth_session"
registration_enabled = true
require_email_verification = false
require_phone_verification = false
# 用户中心等内部服务共享令牌，至少 24 字符；生产必须覆盖。
internal_token = "dev-internal-token-change-me-0001"
enforce_csrf_for_cookie_auth = true
allowed_redirect_origins = ["http://localhost:3000", "http://localhost:8081"]

[security.password]
min_length = 10
max_length = 128
require_upper = true
require_lower = true
require_digit = true
require_symbol = false
history_size = 5
expiry_days = 0
max_failed_attempts = 5
lockout_secs = 900
argon2_memory_kib = 19456
argon2_iterations = 2
argon2_parallelism = 1

[security.mfa]
enforce_for_admins = false
totp_issuer = "Auth Center"

[security.mfa.webauthn]
enabled = false
rp_id = "localhost"
rp_origin = "http://localhost:3000"
rp_name = "Auth Center"

[security.login_rate_limit]
max_attempts = 10
window_secs = 60

[security.otp_rate_limit]
max_attempts = 5
window_secs = 60

[security.otp]
ttl_secs = 600
max_attempts = 5
length = 6
resend_cooldown_secs = 60

[oauth]
enabled = true
require_consent = true
allow_client_credentials = true
default_scope = "openid profile email"
allow_http_redirect_uri = false

[saml]
enabled = true
idp_entity_id = "http://localhost:8080/saml/metadata"
idp_name = "Auth Center"
assertion_lifetime_secs = 300
clock_skew_secs = 60
want_authn_requests_signed = true
sp_metadata_urls = []

[notifications]
# log 或 webhook；webhook 用于接入真实邮件/短信网关
provider = "log"
webhook_url = ""
webhook_token = ""
from_email = "no-reply@example.com"
from_name = "Auth Center"

[events]
# 领域事件投递目标（用户中心内部事件端点）
publish_urls = ["http://localhost:8081/api/v1/internal/events"]
service_token = "dev-internal-token-change-me-0001"
poll_interval_secs = 5
batch_size = 50
max_attempts = 10
allow_http_targets = true

[federation]
state_ttl_secs = 600
allow_auto_register = true
allow_http_providers = false

[logging]
level = "info"
format = "json"

[bootstrap]
admin_username = "admin"
admin_password = ""
admin_email = ""
tenant_code = "default"
tenant_name = "Default Tenant"
