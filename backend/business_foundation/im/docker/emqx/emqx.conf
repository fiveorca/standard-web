node {
  name = "emqx@im-emqx"
  cookie = "im-emqx-cookie"
  data_dir = "data"
}

dashboard {
  listeners.http.bind = 18083
  default_username = "admin"
  default_password = "public"
}

listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 1024000
}

authentication = [
  {
    mechanism = password_based
    backend = http
    method = post
    url = "http://im-service:8080/api/v1/internal/mqtt/auth"
    headers = {
      "Content-Type" = "application/json"
      "X-Internal-Token" = "dev-internal-token-change-me"
    }
    body {
      username = "${username}"
      password = "${password}"
      clientid = "${clientid}"
    }
    connect_timeout = "5s"
    request_timeout = "5s"
  }
]

authorization {
  no_match = deny
  deny_action = ignore
  cache {
    enable = true
    max_size = 1024
    ttl = "1m"
  }
  sources = [
    {
      type = http
      enable = true
      url = "http://im-service:8080/api/v1/internal/mqtt/acl"
      method = post
      headers = {
        "Content-Type" = "application/json"
        "X-Internal-Token" = "dev-internal-token-change-me"
      }
      body {
        username = "${username}"
        topic = "${topic}"
        action = "${action}"
      }
      connect_timeout = "5s"
      request_timeout = "5s"
    }
  ]
}
