services:
  postgres:
    image: postgres:16-alpine
    container_name: im-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-im}
      POSTGRES_USER: ${POSTGRES_USER:-im}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-im_password}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-im} -d ${POSTGRES_DB:-im}"]
      interval: 5s
      timeout: 5s
      retries: 20

  emqx:
    image: emqx/emqx:5.8.4
    container_name: im-emqx
    hostname: im-emqx
    environment:
      EMQX_NODE__NAME: emqx@im-emqx
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USER:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-public}
    volumes:
      - ./docker/emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - emqxdata:/opt/emqx/data
    ports:
      - "${EMQX_MQTT_PORT:-1883}:1883"
      - "${EMQX_DASHBOARD_PORT:-18083}:18083"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/1883'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  im-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: im-service
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-im}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-im}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-im_password}
      IM_ENCRYPTION_KEY: ${IM_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      IM_ADMIN_API_KEY: ${IM_ADMIN_API_KEY:-dev-admin-key-change-me}
      IM_INTERNAL_TOKEN: ${IM_INTERNAL_TOKEN:-dev-internal-token-change-me}
      IM_DEVICE_TOKEN_PEPPER: ${IM_DEVICE_TOKEN_PEPPER:-dev-device-pepper-change-me}
      IM_HTTP_PORT: 8080
      IM_GRPC_PORT: 9090
      IM_SEED_BROKER_HOST: emqx
      IM_SEED_BROKER_TCP_PORT: 1883
      IM_EMAIL_ATTACHMENT_DIR: /app/attachments
      IM_EMAIL_WORKER_ENABLED: "true"
    volumes:
      - attachments:/app/attachments
    ports:
      - "${IM_HTTP_PORT:-8080}:8080"
      - "${IM_GRPC_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

volumes:
  pgdata:
  emqxdata:
  attachments:
