[package]
name = "user-center"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "User profile, group and organization center for the Rust + Axum identity platform"
readme = "README.md"

[[bin]]
name = "user-center"
path = "src/main.rs"

[lib]
name = "user_center"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros", "json", "http2"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
constant_time_eq = "0.4"
csv = "1"
dotenvy = "0.15"
jsonwebtoken = "9"
rand = "0.8"
redis = { version = "0.27", features = ["aio", "tokio-comp", "connection-manager", "script"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "macros",
] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "limit", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
