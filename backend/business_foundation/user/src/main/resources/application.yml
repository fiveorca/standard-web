server:
  port: ${USER_PORT:8081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: user-center
  datasource:
    url: ${USER_DATABASE_URL:jdbc:postgresql://localhost:5432/user_center}
    username: ${USER_DATABASE_USER:user_center}
    password: ${USER_DATABASE_PASSWORD:user_center}
    hikari:
      maximum-pool-size: ${USER_DB_POOL_SIZE:10}
      minimum-idle: 1
      connection-timeout: ${USER_DB_CONNECT_TIMEOUT_MS:5000}
      validation-timeout: 2000
  flyway:
    enabled: ${USER_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 300ms
      connect-timeout: 500ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  jackson:
    time-zone: UTC

user:
  internal-token: ${USER_INTERNAL_TOKEN:}
  events-target: ${USER_EVENTS_TARGET:http://localhost:8080/api/v1/internal/events}
  cors: ${CORS:}
  trust-proxy: ${USER_TRUST_PROXY:true}
  auth:
    base-url: ${USER_AUTH_BASE_URL:http://localhost:8080}
    jwks-url: ${USER_JWKS_URL:${USER_AUTH_JWKS_URL:http://localhost:8080/oauth2/jwks}}
    issuer: ${USER_AUTH_ISSUER:}
    audience: ${USER_AUTH_AUDIENCE:}
    timeout-seconds: ${USER_AUTH_TIMEOUT_SECONDS:5}
    jwks-cache-seconds: ${USER_JWKS_CACHE_SECONDS:300}
  registration:
    enabled: ${USER_REGISTRATION_ENABLED:true}
    require-review: ${USER_REGISTRATION_REQUIRE_REVIEW:true}
    rate-limit-per-minute: ${USER_REGISTRATION_RATE_LIMIT:10}
  batch:
    max-items: ${USER_BATCH_MAX_ITEMS:500}

logging:
  level:
    root: INFO
    com.platform.user: INFO
