[package]
name = "auth-center"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Identity authentication, authorization and OAuth2/OIDC/SAML center implemented with Rust + Axum"
readme = "README.md"

[[bin]]
name = "auth-center"
path = "src/main.rs"

[lib]
name = "auth_center"
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "json", "http2"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
constant_time_eq = "0.4"
dotenvy = "0.15"
flate2 = "1"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1"
jsonwebtoken = "9"
percent-encoding = "2"
p256 = { version = "0.13", features = ["pem", "pkcs8"] }
rand = "0.8"
rcgen = { version = "0.13", features = ["pem"] }
redis = { version = "0.27", features = ["aio", "tokio-comp", "connection-manager", "script", "json"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rsa = { version = "0.9", features = ["pem", "sha2"] }
saml = { version = "0.1.0-alpha.1", default-features = false, features = ["rsa-sha", "ecdsa-sha", "slo", "metadata-emit", "xmlenc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
totp-rs = { version = "6", features = ["gen_secret", "otpauth", "serde"] }
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.6", features = ["cors", "limit", "request-id", "set-header", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
webauthn-rs = { version = "0.6", features = ["danger-allow-state-serialisation"] }
zeroize = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"

[profile.dev]
opt-level = 1
