name: identity-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth:
    build:
      context: ./auth
    environment:
      AUTH_BASE_URL: http://localhost:8080
      AUTH_ISSUER: http://localhost:8080
      AUTH_CORS_ORIGINS: "*"
      AUTH_DATABASE_URL: jdbc:postgresql://postgres:5432/auth_center
      AUTH_DATABASE_USER: postgres
      AUTH_DATABASE_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_DB: "0"
      AUTH_ENCRYPTION_KEY: 3geuNbeEwCC5OwBz78oo3fbuecUVKlNa4NmP1beftWQ=
      AUTH_INTERNAL_TOKEN: dev-internal-token-change-me
      AUTH_COOKIE_SECURE: "false"
      AUTH_EVENTS_TARGET: http://user:8081/api/v1/internal/events
      USER_SERVICE_URL: http://user:8081
      AUTH_BOOTSTRAP_ADMIN_USERNAME: admin
      AUTH_BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: Admin@12345
      AUTH_BOOTSTRAP_CLIENT_SECRET: dev-client-secret-change-me
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  user:
    build:
      context: ./user
    environment:
      USER_DATABASE_URL: jdbc:postgresql://postgres:5432/user_center
      USER_DATABASE_USER: postgres
      USER_DATABASE_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_DATABASE: "1"
      USER_INTERNAL_TOKEN: dev-internal-token-change-me
      USER_EVENTS_TARGET: http://auth:8080/api/v1/internal/events
      USER_AUTH_BASE_URL: http://auth:8080
      USER_JWKS_URL: http://auth:8080/oauth2/jwks
      USER_AUTH_ISSUER: http://localhost:8080
      CORS: "*"
      USER_REGISTRATION_ENABLED: "true"
      USER_REGISTRATION_REQUIRE_REVIEW: "true"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
