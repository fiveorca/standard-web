[package]
name = "logserver"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Unified Log Service - Rust + Axum + Tonic + Kafka + ClickHouse"
license = "Apache-2.0"

[[bin]]
name = "logserver"
path = "src/main.rs"

[lib]
name = "logserver"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
# ClickHouse 官方 Rust 客户端 (异步，HTTP 协议)
clickhouse = { version = "0.14", default-features = true, features = ["chrono", "uuid", "inserter", "rustls-tls"] }
futures = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
once_cell = "1"
opentelemetry = "0.27"
opentelemetry-otlp = { version = "0.27", features = ["http-proto", "reqwest-client", "trace"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
prometheus = "0.13"
prost = "0.13"
prost-types = "0.13"
# 纯 Rust Kafka 客户端 (同步 API，用 spawn_blocking 包装)
kafka = { version = "0.10", default-features = false, features = ["flate2", "snap"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.12", features = ["tls"] }
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }

[build-dependencies]
tonic-build = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"

[profile.dev]
opt-level = 1
