[package]
name = "rust-api-gateway"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Production-grade API Gateway implemented in Rust with Axum / Hyper"
license = "Apache-2.0"
repository = "https://example.com/rust-api-gateway"
readme = "docs/README.md"

[[bin]]
name = "gateway"
path = "src/main.rs"

[lib]
name = "gateway"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "ws", "http2"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
futures = "0.3"
hex = "0.4"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio", "server", "server-auto", "service"] }
ipnet = "2"
jsonwebtoken = "9"
moka = { version = "0.12", features = ["future"] }
once_cell = "1"
opentelemetry = "0.27"
opentelemetry-otlp = { version = "0.27", features = ["http-proto", "reqwest-client", "trace"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
prometheus = "0.13"
rand = "0.8"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "script"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.6", features = ["limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio", "server-auto"] }
rcgen = "0.13"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"

[profile.dev]
opt-level = 1
